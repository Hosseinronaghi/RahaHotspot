name: Android RC build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - run: gradle :app:compileDebugKotlin :app:assembleDebug :app:bundleDebug :app:lintDebug :app:testDebugUnitTest
      - run: sha256sum app/build/outputs/apk/debug/*.apk app/build/outputs/bundle/debug/*.aab > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: RahaHotspot-rc3-debug
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/bundle/debug/*.aab
            SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-reports
          path: app/build/reports/
