name: Android RC build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Bundle Vazirmatn fonts and license
        run: |
          mkdir -p app/src/main/res/font app/src/main/assets/licenses
          base=https://raw.githubusercontent.com/rastikerdar/vazirmatn/v33.003
          curl --fail --location --retry 3 "$base/fonts/ttf/Vazirmatn-Regular.ttf" -o app/src/main/res/font/vazirmatn_regular.ttf
          curl --fail --location --retry 3 "$base/fonts/ttf/Vazirmatn-Bold.ttf" -o app/src/main/res/font/vazirmatn_bold.ttf
          curl --fail --location --retry 3 "$base/OFL.txt" -o app/src/main/assets/licenses/Vazirmatn-OFL.txt
          test -s app/src/main/res/font/vazirmatn_regular.ttf
          test -s app/src/main/res/font/vazirmatn_bold.ttf
      - run: gradle :app:compileDebugKotlin :app:assembleDebug :app:bundleDebug :app:lintDebug :app:testDebugUnitTest
      - run: sha256sum app/build/outputs/apk/debug/*.apk app/build/outputs/bundle/debug/*.aab > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: RahaHotspot-rc4-debug
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/bundle/debug/*.aab
            SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-reports
          path: app/build/reports/
